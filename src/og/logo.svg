<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Tank shell — same structure as public/favicon.svg, but with
       "DF" instead of "D" since this version is for larger renders
       (OG cards, etc.) where two letters fit cleanly. -->
  <rect width="64" height="64" rx="12" ry="12" fill="#f1ece2"/>
  <rect x="2" y="2" width="60" height="60" rx="11" ry="11"
        fill="none" stroke="#14306b" stroke-width="3"/>

  <clipPath id="tank">
    <rect x="3.5" y="3.5" width="57" height="57" rx="9.5" ry="9.5"/>
  </clipPath>
  <g clip-path="url(#tank)">
    <path
      d="M 0 22
         Q 8 16, 16 22
         T 32 22
         T 48 22
         T 64 22
         L 64 64
         L 0 64 Z"
      fill="#1f4ea8"/>
  </g>

  <text x="32" y="54"
        text-anchor="middle"
        font-family="Georgia"
        font-weight="700"
        font-size="32"
        letter-spacing="-1"
        fill="#f1ece2">DF</text>
</svg>
