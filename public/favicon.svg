<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Tank shell -->
  <rect width="64" height="64" rx="12" ry="12" fill="#f1ece2"/>
  <rect x="2" y="2" width="60" height="60" rx="11" ry="11"
        fill="none" stroke="#14306b" stroke-width="3"/>

  <!-- Wavy water, clipped to the rounded tank -->
  <clipPath id="tank">
    <rect x="3.5" y="3.5" width="57" height="57" rx="9.5" ry="9.5"/>
  </clipPath>
  <g clip-path="url(#tank)">
    <path
      d="M 0 22
         Q 8 16, 16 22
         T 32 22
         T 48 22
         T 64 22
         L 64 64
         L 0 64 Z"
      fill="#1f4ea8"/>
  </g>

  <!-- Single "D" — bigger and bolder than the DF version so it
       holds up at favicon sizes -->
  <text x="32" y="56"
        text-anchor="middle"
        font-family="Playfair Display, Georgia, serif"
        font-weight="700"
        font-size="40"
        fill="#f1ece2">D</text>
</svg>
